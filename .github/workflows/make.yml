name: Make

on:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Update submodules to latest remote HEAD
      run: git submodule update --init --recursive --remote

    # Installs Free Pascal via Chocolatey and locates the generated compiler location
    - name: Install Pure FPC on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        choco install freepascal --no-progress
        
        # Dynamically search where choco created the bin directory containing fpc.exe
        FPC_BIN_DIR=$(find /c/tools/freepascal -type f -name "fpc.exe" -exec dirname {} \; | head -n 1)
        
        if [ -n "$FPC_BIN_DIR" ]; then
          echo "Found FPC binary directory at: $FPC_BIN_DIR"
          # Convert the MSYS/GitBash path format back to a Windows standard string for the global path mapper
          WINDOWS_PATH=$(cygpath -w "$FPC_BIN_DIR")
          echo "$WINDOWS_PATH" >> $GITHUB_PATH
        else
          echo "ERROR: fpc.exe was not found inside C:\tools\freepascal" && exit 1
        fi

    - name: Build on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: bash .github/workflows/make.sh

    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: bash .github/workflows/make.sh
