name: Make

on:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest # 1. Added Windows to the build target grid

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive 

    - name: Update submodules to latest remote HEAD
      run: git submodule update --init --recursive --remote 

    - name: Build on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: bash .github/workflows/make.sh

    - name: Build on Windows
      if: runner.os == 'Windows' # 2. Only runs when the matrix falls on windows-latest
      shell: bash
      run: bash .github/workflows/make.sh
