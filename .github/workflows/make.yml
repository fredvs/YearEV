name: Make

on:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Update submodules to latest remote HEAD
      run: git submodule update --init --recursive --remote

    # Downloads and deploys the official stable SourceForge installer out-of-the-box
    - name: Install Official Standalone FPC on Windows
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        echo "Downloading official Free Pascal compiler from SourceForge..."
        $url = "https://sourceforge.net"
        Invoke-WebRequest -Uri $url -OutFile "fpc_installer.exe"
        
        echo "Running background silent installation..."
        Start-Process -FilePath ".\fpc_installer.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=C:\fpc" -Wait
        
        echo "Injecting clean binary environment paths..."
        echo "C:\fpc\3.2.2\bin\i386-win32" >> $GITHUB_PATH

    - name: Build on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: bash .github/workflows/make.sh

    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: bash .github/workflows/make.sh
