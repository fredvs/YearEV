name: Make

on:
  schedule:
    - cron:  '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Update submodules to latest remote HEAD
      run: git submodule update --init --recursive --remote

    # 1. LIGHTWEIGHT WINDOWS FPC INSTALLATION (NO LAZARUS)
    - name: Install Pure FPC on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "Downloading and extracting official standalone FPC..."
        curl -sL "https://github.com" -o fpc.zip
        mkdir -p /c/fpc
        unzip -q fpc.zip -d /c/fpc
        
        # Inject the FPC binary path globally into the runner environment path
        echo "/c/fpc/bin" >> $GITHUB_PATH

    - name: Build on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: bash .github/workflows/make.sh

    - name: Build on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: bash .github/workflows/make.sh
